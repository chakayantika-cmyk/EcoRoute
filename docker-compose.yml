services:
  postgres:
    image: postgres:16-alpine
    container_name: ecoroute-postgres
    environment:
      POSTGRES_DB: ecoroute_ai
      POSTGRES_USER: ecoroute
      POSTGRES_PASSWORD: ecoroute_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoroute -d ecoroute_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ecoroute-api
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://ecoroute:ecoroute_dev@postgres:5432/ecoroute_ai?schema=public
      API_PORT: 3001
      API_HOST: 0.0.0.0
      NODE_ENV: development
      LOG_LEVEL: info
      JWT_ACCESS_SECRET: docker-dev-access-secret-change-in-production-min-64-chars-long
      JWT_REFRESH_SECRET: docker-dev-refresh-secret-change-in-production-min-64-chars-long
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ecoroute-web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
